<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Messenger Island</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="collapsed">
    <div class="island">
      <!-- Zwinięty pasek przy górnej krawędzi -->
      <div class="tab" id="tab" role="button" tabindex="0" aria-label="Rozwiń">
        <svg class="chev" viewBox="0 0 26 14" aria-hidden="true"><path d="M3 3 L13 11 L23 3" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <!-- Rozwinięta wyspa: przyciski aplikacji -->
      <header class="bar" data-tauri-drag-region>
        <nav class="apps" id="apps" aria-label="Aplikacje"></nav>
        <button class="icon-btn" id="collapse" title="Zwiń" aria-label="Zwiń"><svg class="chev" viewBox="0 0 26 14" aria-hidden="true"><path d="M3 11 L13 3 L23 11" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </header>

      <!-- Kontener na lekkie moduły HTML/JS (Messenger ma własny natywny WebView) -->
      <main class="content" id="content"></main>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
