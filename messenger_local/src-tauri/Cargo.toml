[package]
name = "messenger_local"
version = "0.1.0"
edition = "2024"
description = "Ultra-lekkowy wrapper Messenger Desktop (Tauri v2) — prywatność, bezpieczeństwo, minimalne RAM"
license = "MIT"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0"
tauri-plugin-notification = "2.0"
url = { version = "2.5", features = [] }
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }